name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tracked files for private data
        run: python3 scripts/check_publish.py
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - name: Install video processing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: uv run ruff check backend tests scripts
      - run: uv run pytest -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: node --test frontend/tests/versions.test.mjs frontend/tests/upscale.test.mjs frontend/tests/references.test.mjs frontend/tests/agent.test.mjs frontend/tests/agentSync.test.mjs
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
